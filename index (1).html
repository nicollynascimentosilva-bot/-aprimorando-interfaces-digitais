<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Conteúdo Dinâmico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <button id="toggle-dark-mode" class="btn-theme" aria-label="Alternar tema">
            Modo Escuro
        </button>
        <!-- Campo de busca dinâmico -->
        <input type="search" id="search-input" class="search-bar" placeholder="Pesquisar posts por título ou tag...">
    </header>

    <main class="container">
        <!-- O JavaScript vai preencher este container automaticamente -->
        <div id="cards-grid" class="cards-grid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
