<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card de Postagem Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Botão para alternar o modo escuro -->
    <button id="toggle-dark-mode" class="btn-theme">Alternar Modo Escuro</button>

    <main class="container">
        <!-- Card de Postagem -->
        <article class="post-card">
            <img src="https://picsum.photos" alt="Imagem de capa do post" class="card-img">
            <div class="card-content">
                <span class="card-tag">Tecnologia</span>
                <h2 class="card-title">Aprendendo Animações em CSS</h2>
                <p class="card-excerpt">Descubra como os seletores e propriedades como transform e box-shadow podem dar vida ao seu layout web.</p>
                <a href="#" class="card-link">Ler mais →</a>
            </div>
        </article>
    </main>

    <script src="script.js"></script>
</body>
</html>
