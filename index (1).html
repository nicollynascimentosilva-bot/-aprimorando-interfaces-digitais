<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card de Postagem Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Botão de acessibilidade com ARIA para leitores de tela -->
    <button id="toggle-dark-mode" class="btn-theme" aria-label="Alternar entre modo claro e escuro">
        Alternar Modo Escuro
    </button>

    <main class="container">
        <!-- Card com foco acessível via teclado caso seja clicável -->
        <article class="post-card" tabindex="0">
            <img 
                src="https://picsum.photos" 
                alt="Notebook aberto sobre uma mesa exibindo linhas de código" 
                class="card-img"
                width="400"
                height="250"
                loading="lazy" 
            >
            <div class="card-content">
                <span class="card-tag">Tecnologia</span>
                <h2 class="card-title">Aprendendo Animações em CSS</h2>
                <p class="card-excerpt">Descubra como os seletores e propriedades como transform e box-shadow podem dar vida ao seu layout web.</p>
                <a href="#" class="card-link" tabIndex="-1">Ler mais <span aria-hidden="true">→</span></a>
            </div>
        </article>
    </main>

    <script src="script.js"></script>
</body>
</html>
